stages:
  - test
  - package
  - publish

default:
  interruptible: true

.go-job:
  image: golang:1.23.6-bookworm
  variables:
    CGO_ENABLED: "0"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOPROXY: "https://goproxy.cn,direct"
    GOSUMDB: "sum.golang.google.cn"
  cache:
    key: "go-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/go-build/
      - .cache/go-mod/

test:
  extends: .go-job
  stage: test
  rules:
    - if: '$AISSH_LOCAL_RELEASE == "true"'
      when: never
    - when: on_success
  script:
    - go test ./...

package:
  extends: .go-job
  stage: package
  rules:
    - if: '$AISSH_LOCAL_RELEASE == "true"'
      when: never
    - when: on_success
  needs:
    - test
  script:
    - |
      version="0.0.0-${CI_COMMIT_SHORT_SHA}"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="$CI_COMMIT_TAG"
      fi
      ./scripts/build-release.sh "$version"
  artifacts:
    name: "aissh-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 7 days

publish-release:
  stage: publish
  image:
    name: curlimages/curl:8.12.1
    entrypoint: [""]
  needs:
    - job: package
      artifacts: true
  rules:
    - if: '$AISSH_LOCAL_RELEASE == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$/'
  script:
    - ./scripts/publish-gitlab.sh "$CI_COMMIT_TAG"
