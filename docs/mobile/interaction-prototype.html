<style>
#ssh-phone { --m-bg:light-dark(#f5f5fa,#17171f);--m-panel:light-dark(#fff,#23232d);--m-text:light-dark(#252434,#eeedf4);--m-sub:light-dark(#777587,#a4a1b4);--m-line:light-dark(#e9e7ef,#373440);--m-accent:light-dark(#6952ce,#b4a0ff);--m-soft:light-dark(#eeebfc,#343044);--m-danger:light-dark(#b84139,#ff9c93);--m-warning:light-dark(#99620d,#ecc582);color:var(--m-text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;max-width:410px;margin:auto;background:var(--m-bg);border:1px solid var(--m-line);border-radius:28px;overflow:hidden;box-sizing:border-box; }
#ssh-phone * {box-sizing:border-box} #ssh-phone button,#ssh-phone input,#ssh-phone textarea {font:inherit} #ssh-phone button {color:inherit;border:0;background:none;min-height:44px;cursor:pointer} #ssh-phone button:focus-visible {outline:2px solid var(--m-accent);outline-offset:-3px} #ssh-phone input,#ssh-phone textarea {font-size:16px;color:var(--m-text);background:var(--m-panel);border:1px solid var(--m-line);border-radius:12px;padding:12px;min-width:0} #ssh-phone button:disabled{opacity:.45;cursor:default} #ssh-phone small {font-size:12px;color:var(--m-sub)} #ssh-phone h1 {font-size:28px;line-height:1.2;letter-spacing:-1px;margin:5px 0 8px;font-weight:650} #ssh-phone h2 {font-size:17px;margin:0;font-weight:600} #ssh-phone p {margin:8px 0} #ssh-phone svg {width:20px;height:20px;flex-shrink:0} #ssh-phone .m-status {display:flex;justify-content:space-between;padding:12px 22px 3px;font-size:12px;font-weight:600} #ssh-phone .m-status span:last-child{display:flex;gap:6px;align-items:center} #ssh-phone .m-status svg{width:14px;height:14px} #ssh-phone .m-head {display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--m-panel);border-bottom:1px solid var(--m-line)} #ssh-phone .m-head>div{flex:1;min-width:0} #ssh-phone .m-head strong,#ssh-phone .m-head small{display:block} #ssh-phone .m-head button{width:44px;display:grid;place-items:center;flex-shrink:0} #ssh-phone .m-head .m-env{background:var(--m-soft);color:var(--m-accent);padding:2px 7px;border-radius:5px;font-size:11px;width:max-content} #ssh-phone .m-body{padding:20px 18px;min-height:435px} #ssh-phone .m-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px} #ssh-phone .m-title>button{background:var(--m-accent);color:var(--m-panel);width:44px;border-radius:14px;display:grid;place-items:center} #ssh-phone .m-row{display:flex;align-items:center;gap:12px} #ssh-phone .m-row>div {flex:1;min-width:0} #ssh-phone .m-row small{display:block;margin-top:3px} #ssh-phone .m-nav {display:flex;padding:7px 10px 12px;background:var(--m-panel);border-top:1px solid var(--m-line)} #ssh-phone .m-nav button{flex:1;display:flex;gap:4px;flex-direction:column;align-items:center;justify-content:center;color:var(--m-sub);font-size:11px} #ssh-phone .m-nav button[aria-current=page]{color:var(--m-accent)} #ssh-phone .m-icon {background:var(--m-soft);color:var(--m-accent);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0} #ssh-phone .m-card{background:var(--m-panel);border:1px solid var(--m-line);border-radius:16px;padding:16px;margin-bottom:12px;text-align:left;width:100%} #ssh-phone .m-card p{color:var(--m-sub);font-size:13px} #ssh-phone .m-card small{display:block} #ssh-phone .m-tag{font-size:11px;border-radius:5px;padding:3px 6px;background:var(--m-soft);color:var(--m-accent);white-space:nowrap} #ssh-phone .m-alert-tag{color:var(--m-danger);background:light-dark(#fff0ed,#402928)} #ssh-phone .m-caption{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px} #ssh-phone .m-caption strong{font-size:13px} #ssh-phone .m-notice{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:20px;width:100%;border-radius:12px;background:var(--m-soft);color:var(--m-accent);text-align:left} #ssh-phone .m-notice span{flex:1} #ssh-phone .m-notice small{color:inherit} #ssh-phone .m-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--m-line);border-radius:12px;padding:10px 15px;background:var(--m-panel);min-height:48px} #ssh-phone .m-primary{background:var(--m-accent);color:light-dark(#fff,#211a38);border:0} #ssh-phone .m-full{width:100%} #ssh-phone .m-secondary{background:var(--m-soft);color:var(--m-accent);border:0} #ssh-phone .m-footer{padding:12px 18px 16px;background:var(--m-panel);border-top:1px solid var(--m-line)} #ssh-phone .m-segments{display:flex;gap:4px;background:var(--m-bg);border-radius:10px;padding:4px;margin:12px 16px 0} #ssh-phone .m-segments button{flex:1;min-height:38px;font-size:13px} #ssh-phone .m-segments button[aria-pressed=true]{background:var(--m-panel);border-radius:8px;color:var(--m-accent);box-shadow:0 1px 4px #0000000d} #ssh-phone .m-chat{padding:20px 18px;min-height:318px} #ssh-phone .m-bubble{margin-left:38px;padding:13px 15px;border-radius:16px 16px 4px 16px;background:var(--m-soft);margin-bottom:22px} #ssh-phone .m-assistant{display:flex;gap:10px} #ssh-phone .m-assistant .m-icon{width:28px;height:28px;border-radius:9px} #ssh-phone .m-assistant .m-icon svg{width:16px;height:16px} #ssh-phone .m-assistant>div{flex:1;min-width:0} #ssh-phone .m-assistant p{margin-top:0} #ssh-phone .m-evidence{display:flex;align-items:center;gap:7px;color:var(--m-sub);border:1px solid var(--m-line);border-radius:10px;padding:4px 9px;width:100%;font-size:12px;margin:12px 0} #ssh-phone .m-pending{padding:13px;border:1px solid var(--m-line);border-radius:12px;background:var(--m-panel);margin:12px 0 0} #ssh-phone .m-pending p{font-size:12px;color:var(--m-sub)} #ssh-phone .m-pending code{display:block;font-size:12px;overflow-wrap:anywhere;margin:8px 0 12px} #ssh-phone .m-compose{display:flex;gap:8px;align-items:flex-end} #ssh-phone .m-compose textarea{width:100%;resize:vertical;min-height:48px;max-height:100px;flex:1;border:0;background:var(--m-bg);padding:13px;font-size:16px} #ssh-phone .m-compose button{background:var(--m-accent);border-radius:13px;width:48px;color:var(--m-panel);display:grid;place-items:center} #ssh-phone .m-shortcuts{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap} #ssh-phone .m-shortcuts button{background:var(--m-panel);border:1px solid var(--m-line);border-radius:8px;min-height:42px;min-width:43px;padding:4px 10px;font:12px ui-monospace,monospace} #ssh-phone .m-code{white-space:pre-wrap;overflow-wrap:anywhere;background:light-dark(#f3f2f8,#19171f);color:var(--m-text);padding:14px;border-radius:12px;font:12px/1.7 ui-monospace,monospace;user-select:text;margin:12px 0} #ssh-phone .m-detail-row{display:flex;gap:18px;justify-content:space-between;margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--m-line);font-size:13px} #ssh-phone .m-detail-row span{color:var(--m-sub)} #ssh-phone .m-detail-row strong{font-weight:500;word-break:break-word;text-align:right} #ssh-phone .m-stack{display:grid;gap:10px} #ssh-phone .m-warning{padding:12px;border-radius:12px;background:light-dark(#fff4df,#3a3022);color:var(--m-warning);font-size:13px;margin:12px 0} #ssh-phone .m-confirm{display:flex;gap:12px;align-items:flex-start;padding:12px 0} #ssh-phone .m-confirm input{min-width:22px;min-height:22px;accent-color:var(--m-accent)} #ssh-phone .m-confirm span{font-size:13px} #ssh-phone .m-risk-buttons{display:flex;gap:10px} #ssh-phone .m-risk-buttons>*{flex:1} #ssh-phone .m-hero-result{display:grid;justify-items:center;text-align:center;padding:34px 15px} #ssh-phone .m-hero-result>.m-icon{width:56px;height:56px;margin-bottom:15px} #ssh-phone .m-hero-result h2{margin-bottom:8px} #ssh-phone .m-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px} #ssh-phone .m-metrics strong{font-size:23px;font-weight:600;display:block;margin:10px 0 3px} #ssh-phone .m-progress{height:5px;border-radius:4px;background:var(--m-line);overflow:hidden;margin-top:10px} #ssh-phone .m-progress span{height:100%;display:block;background:var(--m-accent)} #ssh-phone .m-sample{text-align:center;font-size:11px;color:var(--m-sub);margin:8px 0 0} #ssh-phone .m-search{width:100%;margin-bottom:16px} #ssh-phone .m-divider{height:1px;background:var(--m-line);margin:18px 0} #ssh-phone .m-terminal{background:#141a25;color:#dce4f0;border-radius:12px;padding:14px;font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;min-height:220px} #ssh-phone .m-online{color:light-dark(#23815e,#80d4ac)} #ssh-phone .m-back{display:flex;align-items:center;gap:5px;color:var(--m-accent)}
</style>
<div id="ssh-phone" aria-label="手机原生客户端交互原型">
  <div class="m-status"><span>9:41</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <div id="m-screen"></div>
</div>
<script>
(()=>{
 const root=document.getElementById('ssh-phone'), screen=root.querySelector('#m-screen');
 const state={page:'sessions',view:'chat',approved:false,rejected:false,confirmed:false,highRisk:false,offline:false,density:'comfortable',home:'sessions',query:'',message:'',returnPage:'workbench'};
 const saved=window.openai?.widgetState?.privateContent;
 if(saved && ['sessions','alerts','hosts','profile','workbench','review','confirm','result','new','switcher'].includes(saved.page)) Object.assign(state,saved);
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(label,action,cls='m-btn')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
 const sample='<p class="m-sample">交互原型 · 示例数据</p>';
 function nav(){return `<nav class="m-nav" aria-label="主导航">${[['sessions','messages-square','会话'],['alerts','bell','告警'],['hosts','server','主机'],['profile','circle-user-round','我的']].map(([p,i,t])=>`<button data-page="${p}" ${state.page===p?'aria-current="page"':''}>${icon(i)}<span>${t}${p==='alerts'?' · 1':''}</span></button>`).join('')}</nav>`;}
 function head(title,sub,back='sessions',right=''){return `<header class="m-head"><button aria-label="返回" data-page="${back}">${icon('chevron-left')}</button><div><strong>${title}</strong><small>${sub}</small></div>${right}</header>`;}
 function home(){
  const rows=[['排查订单接口超时','prod-api-01','生产环境','等待确认'],['查看数据库连接数','prod-db-02','生产环境','AI 已完成'],['部署后的健康检查','staging-api','测试环境','昨天']];
  return `<div class="m-body"><div class="m-title"><div><small>WRD AI SSH</small><h1>会话</h1><small>继续处理手边的问题</small></div><button aria-label="新建会话" data-page="new">${icon('plus')}</button></div>${state.approved||state.rejected?'':btn(`${icon('shield-alert')}<span>1 条命令等待你确认<small style="display:block">prod-api-01 · 生产环境</small></span>${icon('chevron-right')}`,'review','m-notice')}<input class="m-search" aria-label="搜索会话" placeholder="搜索会话或主机" value="${esc(state.query)}" id="m-search"/><div class="m-caption"><strong>最近会话</strong><small>会话进度自动保留</small></div>${rows.filter(r=>r.join(' ').includes(state.query)).map((r,i)=>`<button class="m-card" data-page="workbench"><div class="m-row"><span class="m-icon">${icon('messages-square')}</span><div><strong>${r[0]}</strong><small>${r[1]} · ${r[2]}</small></div></div><div class="m-caption" style="margin-bottom:0"><small>${i===0?'刚刚':'今天 09:12'}</small><span class="m-tag ${i===0?'m-alert-tag':''}">${i===0 && state.approved?'已执行':i===0 && state.rejected?'已拒绝':r[3]}</span></div></button>`).join('')}${sample}</div>${nav()}`;
 }
 function workbench(){
  const offline=state.offline?`<div class="m-warning" role="status">连接已中断 · 当前显示缓存内容，恢复后才能操作。</div>`:'';
  let body='';
  if(state.view==='chat') body=`<div class="m-chat">${offline}<div class="m-bubble">${esc(state.message||'订单接口一直超时，帮我看看原因。')}</div><div class="m-assistant"><span class="m-icon">${icon('sparkles')}</span><div><p>最近 5 分钟，上游连接超时明显增多。CPU 和内存仍在正常范围内。</p><p>建议先查看 Nginx 错误日志，确认请求卡在哪个上游。</p>${btn(`${icon('chevron-right')} 已检查 3 项 · 查看诊断依据`,'evidence','m-evidence')}<div id="m-evidence" hidden><small>CPU 负载正常 · 内存 62% · 最近请求出现 upstream timed out</small></div>${state.approved?'<div class="m-pending"><strong class="m-online">命令执行完成</strong><p>日志指向上游 10.0.2.18:8080，AI 正在继续分析。</p></div>':state.rejected?'<div class="m-pending"><strong>已拒绝执行</strong><p>可以补充信息，让 AI 调整排查方案。</p></div>':`<div class="m-pending"><div class="m-row">${icon('shield-check')}<strong>查看 Nginx 错误日志</strong></div><p>只读操作 · prod-api-01</p><code>tail -n 100 /var/log/nginx/error.log</code>${btn('查看命令并确认','review','m-btn m-secondary m-full')}</div>`}</div></div></div><div class="m-footer"><div class="m-compose"><textarea rows="1" aria-label="描述问题" placeholder="描述问题，或补充线索…" id="m-message"></textarea><button aria-label="发送消息" data-action="send" ${state.offline?'disabled':''}>${icon('arrow-up')}</button></div><small>换行不发送，点击按钮发送</small></div>`;
  if(state.view==='monitor')body=`<div class="m-body">${offline}<div class="m-caption" style="margin-top:0"><strong>当前主机</strong><small>${state.offline?'数据已过期':'更新于 09:41:02'}</small></div><div class="m-metrics">${[['CPU','28','%'],['内存','62','%'],['磁盘','71','%'],['负载','0.82','']].map(([a,b,c])=>`<div class="m-card"><small>${a}</small><strong>${b}<small style="display:inline"> ${c}</small></strong><div class="m-progress"><span style="width:${c?b:30}%"></span></div></div>`).join('')}</div><div class="m-card"><div class="m-row">${icon('activity')}<strong>Nginx 上游连接超时</strong></div><p>最近 5 分钟检测到 28 次异常，持续 3 分钟。</p>${btn('让 AI 分析这项异常','diagnose','m-btn m-secondary m-full')}</div><small>详细采集结果可展开查看，表格按条目展示。</small>${sample}</div>`;
  if(state.view==='terminal')body=`<div class="m-body">${offline}<div class="m-caption" style="margin-top:0"><strong>SSH 终端</strong><small>UTF-8 · 48 列</small></div><div class="m-terminal" id="m-terminal" role="log">ops@prod-api-01:~$ uptime\n 09:41:02 up 42 days,  3 users,\n load average: 0.82, 0.68, 0.61\n\nops@prod-api-01:~$ <span>▌</span></div><div class="m-shortcuts">${['Esc','Tab','Ctrl+C','↑','↓','←','→'].map(t=>btn(t,'key:'+t)).join('')}</div><div class="m-compose"><input aria-label="终端输入" id="m-command" placeholder="输入命令" style="flex:1"/><button aria-label="发送到终端" data-action="terminal-send" ${state.offline?'disabled':''}>${icon('corner-down-left')}</button></div><div class="m-caption">${btn('横屏查看','landscape','m-back')}${btn('粘贴多行命令','paste','m-back')}</div>${sample}</div>`;
  return `${head('订单接口超时','prod-api-01 · 生产环境','sessions',`<button aria-label="切换会话" data-page="switcher">${icon('panels-top-left')}</button>`)}<div class="m-segments" aria-label="工作区">${[['chat','AI 对话'],['monitor','监控'],['terminal','终端']].map(([v,t])=>`<button data-view="${v}" aria-pressed="${state.view===v}">${t}</button>`).join('')}</div>${body}`;
 }
 function review(){return `${head('确认操作','步骤 1 / 2 · 阅读完整命令',state.returnPage)}<div class="m-body"><span class="m-tag">只读操作</span><h2 style="margin-top:14px">查看最近 100 行错误日志</h2><p style="color:var(--m-sub)">帮助确认接口超时的上游地址及错误类型。</p><div class="m-divider"></div><div class="m-detail-row"><span>执行主机</span><strong>prod-api-01</strong></div><div class="m-detail-row"><span>环境 / 账号</span><strong>生产环境 · ops</strong></div><div class="m-detail-row"><span>预期影响</span><strong>读取日志，不修改文件</strong></div><div class="m-caption"><strong>完整命令</strong><small>自动换行 · 可选择文本</small></div><pre class="m-code">tail -n 100 /var/log/nginx/error.log</pre><small>只执行这条命令，后续建议仍需单独确认。</small>${state.offline?'<div class="m-warning">连接已中断，不能执行。</div>':''}${sample}</div><div class="m-footer m-stack">${state.highRisk?btn('继续确认','confirm','m-btn m-primary m-full'):`<button class="m-btn m-primary m-full" data-action="execute-read" ${state.offline?'disabled':''}>执行这条只读命令</button>`}${btn('拒绝本次操作','reject','m-btn m-full')}</div>`;}
 function confirm(){return `${head('确认执行','步骤 2 / 2 · 最后核对','review')}<div class="m-body"><div class="m-warning">即将在生产环境执行</div><h2>prod-api-01</h2><p>账号：ops · 10.0.1.12:22</p><pre class="m-code">tail -n 100 /var/log/nginx/error.log</pre><label class="m-confirm"><input id="m-confirm-check" type="checkbox" ${state.confirmed?'checked':''}/><span>我已核对执行目标与完整命令，确认本次操作。</span></label><label><small>输入主机名称 prod-api-01</small><input id="m-confirm-host" aria-label="确认执行主机" placeholder="prod-api-01" autocomplete="off" style="width:100%;margin:8px 0 16px" /></label><small>确认页面打开期间，如果命令或连接状态发生变化，本次确认失效。</small>${state.offline?'<div class="m-warning">连接已中断，不能执行。</div>':''}${sample}</div><div class="m-footer m-stack"><button class="m-btn m-primary m-full" data-action="execute" disabled>确认执行一次</button>${btn('返回检查命令','review','m-btn m-full')}</div>`;}
 function result(){return `${head('操作结果','prod-api-01 · 生产环境','workbench')}<div class="m-body"><div class="m-hero-result"><span class="m-icon">${icon('check')}</span><h2>命令已执行</h2><small>退出码 0 · 耗时 0.4 秒</small></div><pre class="m-code">${state.highRisk?'nginx.service: active (running)':'upstream timed out (110: Connection timed out)\nupstream: http://10.0.2.18:8080/api/orders'}</pre><p>AI 会结合执行结果继续分析，可返回对话查看后续建议。</p>${sample}</div><div class="m-footer">${btn('返回 AI 对话','diagnose','m-btn m-primary m-full')}</div>`;}
 function alerts(){return `<div class="m-body"><div class="m-title"><div><small>需要你关注</small><h1>告警</h1></div><span class="m-tag m-alert-tag">1 条未处理</span></div><div class="m-card"><div class="m-caption" style="margin-top:0"><span class="m-tag m-alert-tag">持续异常</span><small>3 分钟前</small></div><h2>订单接口超时增多</h2><small style="margin-top:8px">prod-api-01 · 生产环境</small><p>5 分钟内出现 28 次上游连接超时，超过阈值 10 次。</p><div class="m-detail-row"><span>影响范围</span><strong>/api/orders</strong></div>${btn('带上告警，让 AI 排查','diagnose','m-btn m-primary m-full')}${btn('标记为已读','read-alert','m-btn m-full')}</div><div class="m-caption"><strong>已恢复</strong><small>今天</small></div><div class="m-card"><strong>数据库连接数恢复正常</strong><small style="margin-top:8px">prod-db-02 · 08:32 恢复</small></div>${sample}</div>${nav()}`;}
 function hosts(){return `<div class="m-body"><div class="m-title"><div><small>连接你的环境</small><h1>主机</h1></div>${btn(icon('plus'),'new','m-icon')}</div>${[['prod-api-01','10.0.1.12','生产环境'],['prod-db-02','10.0.1.24','生产环境'],['staging-api','10.0.2.18','测试环境']].map(([n,a,g])=>`<button class="m-card m-row" data-page="new"><span class="m-icon">${icon('server')}</span><div><strong>${n}</strong><small>${g} · ${a}</small></div>${icon('chevron-right')}</button>`).join('')}<p style="color:var(--m-sub)">点击主机新建会话；已有会话可直接继续。</p>${sample}</div>${nav()}`;}
 function newSession(){return `${head('新建会话','选择主机后开始排障','hosts')}<div class="m-body"><h2>连接到哪台主机？</h2><div class="m-card m-row" style="margin-top:18px"><span class="m-icon">${icon('server')}</span><div><strong>prod-api-01</strong><small>生产环境 · ops@10.0.1.12</small></div>${icon('check')}</div><label><small>先描述问题（可选）</small><textarea id="m-new-prompt" style="width:100%;margin-top:8px" rows="3" placeholder="例如：订单接口响应变慢了"></textarea></label><div class="m-warning">首次连接需要核对主机指纹。已保存的凭据不会显示在对话中。</div>${sample}</div><div class="m-footer">${btn('连接并开始对话','start','m-btn m-primary m-full')}</div>`;}
 function switcher(){return `${head('切换会话','切换页面不会结束当前任务','workbench')}<div class="m-body">${[['排查订单接口超时','prod-api-01 · 当前会话'],['查看数据库连接数','prod-db-02 · AI 已完成'],['部署后的健康检查','staging-api · 已结束']].map(([t,s])=>`<button class="m-card m-row" data-page="workbench"><span class="m-icon">${icon('messages-square')}</span><div><strong>${t}</strong><small>${s}</small></div>${icon('chevron-right')}</button>`).join('')}${btn('新建会话','new','m-btn m-secondary m-full')}${sample}</div>`;}
 function profile(){return `<div class="m-body"><div class="m-title"><div><small>手机客户端</small><h1>我的</h1></div></div><div class="m-card"><div class="m-row"><span class="m-icon">${icon('smartphone')}</span><div><strong>WRD AI SSH</strong><small>原生导航 · 安全凭据 · 后台恢复</small></div></div></div><button class="m-card m-row" data-action="offline"><div><strong>演示连接中断</strong><small>${state.offline?'当前：断线状态':'当前：连接正常'}，点击切换</small></div>${icon(state.offline?'wifi-off':'wifi')}</button><div class="m-card"><strong>通知与隐私</strong><p>锁屏只显示待处理提醒；命令内容、输出和凭据进入 App 解锁后查看。</p></div><div class="m-card"><strong>退出与断开分开</strong><p>返回列表、锁屏或切换 App 不代表结束 SSH。断开连接有单独确认。</p></div>${sample}</div>${nav()}`;}
 function render(){
  const pages={sessions:home,workbench,review,confirm,result,alerts,hosts,new:newSession,switcher,profile};
  screen.innerHTML=(pages[state.page]||home)();
  if(state.highRisk){screen.innerHTML=screen.innerHTML.replaceAll('tail -n 100 /var/log/nginx/error.log','sudo systemctl restart nginx').replaceAll('查看最近 100 行错误日志','重启 Nginx 服务').replaceAll('查看 Nginx 错误日志','重启 Nginx 服务').replaceAll('只读操作','高风险操作').replaceAll('读取日志，不修改文件','重启服务，可能中断连接').replaceAll('帮助确认接口超时的上游地址及错误类型。','重新启动 Nginx，期间入口流量可能短暂中断。').replaceAll('建议先查看 Nginx 错误日志，确认请求卡在哪个上游。','检测到 Nginx 工作进程无响应。重启可能恢复服务，但会中断现有连接，需要你确认。').replaceAll('步骤 1 / 2 · 阅读完整命令','步骤 1 / 2 · 阅读完整命令');}else{screen.innerHTML=screen.innerHTML.replaceAll('步骤 1 / 2 · 阅读完整命令','阅读完整命令');}
  root.style.setProperty('--m-spacing',state.density==='compact'?'12px':'18px');
  root.querySelectorAll('.m-card').forEach(el=>el.style.padding=state.density==='compact'?'12px':'16px');
  if(globalThis.lucide) lucide.createIcons();
 }
 function save(){window.openai?.setWidgetState({modelContent:{page:state.page,view:state.view,offline:state.offline,home:state.home,density:state.density},privateContent:{...state}})?.catch(()=>{});}
 screen.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b || b.disabled)return;
  if(b.dataset.page){state.page=b.dataset.page;render();save();return;}
  if(b.dataset.view){state.view=b.dataset.view;render();save();return;}
  const a=b.dataset.action;
  if(a==='review'){if(state.page!=='confirm')state.returnPage=state.page;state.page='review';state.confirmed=false;}
  else if(a==='execute-read'){if(state.offline)return;state.approved=true;state.rejected=false;state.page='result';}
  else if(a==='confirm'){state.page='confirm';state.confirmed=false;}
  else if(a==='execute'){if(!state.confirmed||state.offline||screen.querySelector('#m-confirm-host')?.value!=='prod-api-01')return;state.approved=true;state.rejected=false;state.page='result';}
  else if(a==='reject'){state.rejected=true;state.approved=false;state.page='workbench';state.view='chat';}
  else if(a==='diagnose'){state.page='workbench';state.view='chat';}
  else if(a==='evidence'){screen.querySelector('#m-evidence').hidden=!screen.querySelector('#m-evidence').hidden;return;}
  else if(a==='send'){const m=screen.querySelector('#m-message').value.trim();if(!m)return;state.message=m;}
  else if(a==='new'){state.page='new';}
  else if(a==='start'){state.message=screen.querySelector('#m-new-prompt')?.value.trim()||state.message;state.page='workbench';state.view='chat';}
  else if(a==='read-alert'){b.textContent='已读 · 异常仍在持续';b.disabled=true;return;}
  else if(a==='offline'){state.offline=!state.offline;}
  else if(a==='terminal-send'){const input=screen.querySelector('#m-command');if(!input.value.trim())return;screen.querySelector('#m-terminal').textContent+='\nops@prod-api-01:~$ '+input.value+'\n[原型演示，不执行命令]';input.value='';return;}
  else if(a?.startsWith('key:')){screen.querySelector('#m-command').value=a.slice(4)==='Ctrl+C'?'^C':a.slice(4);return;}
  else if(a==='paste'){screen.querySelector('#m-command').value='粘贴多行内容后，先预览再发送';return;}
  else if(a==='landscape'){root.style.maxWidth=root.style.maxWidth==='650px'?'410px':'650px';b.textContent=root.style.maxWidth==='650px'?'返回竖屏':'横屏查看';return;}
  render();save();
 });
 screen.addEventListener('change',e=>{if(e.target.id==='m-confirm-check'){state.confirmed=e.target.checked;const execute=screen.querySelector('[data-action=execute]');execute.disabled=!state.confirmed||state.offline||screen.querySelector('#m-confirm-host')?.value!=='prod-api-01';}});
 screen.addEventListener('input',e=>{if(e.target.id==='m-confirm-host'){screen.querySelector('[data-action=execute]').disabled=!state.confirmed||state.offline||e.target.value!=='prod-api-01';}if(e.target.id==='m-search'){const start=e.target.selectionStart;state.query=e.target.value;render();const input=screen.querySelector('#m-search');input.focus();input.setSelectionRange(start,start);}});
 window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data){Object.assign(state,data);render();}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{if(['sessions','alerts'].includes(state.page))state.page=state.home;render();save();}});tweak.addSelect(state,'home',{label:'默认入口',options:[{label:'会话优先',value:'sessions'},{label:'告警优先',value:'alerts'}]});tweak.addSelect(state,'density',{label:'列表密度',options:[{label:'舒适',value:'comfortable'},{label:'紧凑',value:'compact'}]});tweak.addToggle(state,'offline',{label:'演示连接中断'});tweak.addToggle(state,'highRisk',{label:'演示高风险命令'});}
})();
</script>
